card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}.label{font-size:12px;color:var(--muted)}.value{font-size:25px;font-weight:750;margin-top:7px}.sub{font-size:12px;color:var(--muted);margin-top:6px}.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-bottom:16px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0;margin-bottom:16px}.panel-head{padding:15px 17px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.panel-head strong{font-size:14px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{color:var(--muted);font-weight:600;background:var(--panel)}tr:last-child td{border-bottom:0}.ok{color:var(--ok);font-weight:700}.warn{color:var(--warn);font-weight:700}.danger-text{color:var(--danger);font-weight:700}.toolbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}.input{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px 11px;min-width:210px}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:var(--accent2);color:var(--accent);font-size:11px;font-weight:700}.badge.ok{color:var(--ok)}.badge.warn{color:var(--warn)}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding:18px;min-width:0}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}.field{min-width:0}.field .input{width:100%;min-width:0}.field.full{grid-column:1/-1}.notice{margin:14px 18px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--accent2);font-size:13px}.metric-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:16px}.metric{border:1px solid var(--line);border-radius:8px;padding:12px}.metric .name{font-size:11px;color:var(--muted)}.metric .num{font-weight:750;margin-top:5px}.section-title{font-size:15px;font-weight:750;margin:22px 0 10px}.subtle{color:var(--muted);font-size:12px}.actions-cell{display:flex;gap:6px}.sidebar-toggle{margin-bottom:14px}.mobile-menu{display:none}.mobile-backdrop{display:none}.modal-backdrop{display:none;position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:100;align-items:center;justify-content:center;padding:16px}.modal-backdrop.visible{display:flex}.modal{width:min(680px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.2)}.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}.modal-close{border:0;background:none;color:var(--muted);font-size:24px;line-height:1;padding:4px}.modal-body{padding:18px}.modal-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.login{max-width:460px;margin:60px auto}.login .panel{padding:26px}.login h2{margin-top:0}.hidden{display:none}

 .owned-row td{background:rgba(36,87,214,.08)}.owned-swatch{display:inline-block;width:14px;height:14px;border-radius:3px;background:rgba(36,87,214,.18);vertical-align:middle}.tranche-purchased td{background:rgba(24,121,78,.08)}.detail-link{border:0;background:none;color:var(--accent);padding:0;font-weight:650;text-align:left}.detail-link:hover{text-decoration:underline}.capital-entry{display:flex;gap:8px;align-items:center;margin-top:8px}.capital-entry .input{min-width:0;flex:1}.capital-entry .btn{white-space:nowrap}

function table(headers,rows,opts={}){return '<div class="panel"><div class="table-wrap"><table><thead><tr>'+headers.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr'+(r.rowClass?' class="'+r.rowClass+'"':'')+'>'+r.map((x,i)=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</tbody></table></div></div>'}

let detailSourcePage="prices";let selectedTradeIndex=0;const averagingState={"7203":[true,true,false,false,false],"6501":[false,false,false,false,false]};function showTradeDetail(index){selectedTradeIndex=index;render("tradeDetail");}
