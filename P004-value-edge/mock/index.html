function epsChangeValue(year,key){const sources={q1change:[year+"_q1eps",(year-1)+"_q1eps"],q2change:[year+"_q2eps",(year-1)+"_q2eps"],q3change:[year+"_q3eps",(year-1)+"_q3eps"],currentChange:[year+"_yearEnd",(year-1)+"_yearEnd"],nextChange:[year+"_nextYear",year+"_yearEnd"]};const pair=sources[key];if(!pair)return "";const current=analysisValue(pair[0]),previous=analysisValue(pair[1]);if(current===""||current===null)return "";if(previous===""||previous===null)return "-";const now=Number(current),before=Number(previous);if(!Number.isFinite(now)||!Number.isFinite(before))return "-";if(now<=0)return "-";if(before<=0)return "プラ転";return (Math.trunc(((now-before)/before)*100)/100).toFixed(2);}
function earningsRate(year,key){const value=epsChangeValue(year,key);if(value==="プラ転")return {turn:true};const rate=Number(value);return value!==""&&value!=="-"&&Number.isFinite(rate)?{rate}:null;}
function classifyQuarter(year,key,previousGood,periodLabel){const result=earningsRate(year,key);if(!result)return {period:periodLabel,label:"未判定",good:null};if(result.turn)return {period:periodLabel,label:"◎ 新規（プラ転）",good:true};if(result.rate>=0.10)return {period:periodLabel,label:"◎ 新規",good:true};if(result.rate>=0&&previousGood===true)return {period:periodLabel,label:"○ 継続",good:true};if(result.rate>=0)return {period:periodLabel,label:"対象外",good:false};return {period:periodLabel,label:"× 悪決算",good:false};}
function classifyYearEnd(year,previousGood){const current=earningsRate(year,"currentChange"),next=earningsRate(year,"nextChange"),period=year+"年度末";if(!current||!next)return {period,label:"未判定",good:null};if(current.turn)return {period,label:"対象外（当期EPS増減を判定できません）",good:false};if(current.rate<0)return {period,label:"対象外（当期EPS増減が0%未満）",good:false};if(next.turn)return {period,label:"◎ 新規（次期プラ転）",good:true};const sum=current.rate+next.rate;if(sum>=0.10)return {period,label:"◎ 新規",good:true};if(sum>=0&&previousGood===true)return {period,label:"○ 継続",good:true};if(sum>=0)return {period,label:"対象外",good:false};return {period,label:"対象外",good:false};}
function getGoodEarningsSummary(){let previousGood=null;const decisions=[];for(const year of analysisYears.slice().sort((a,b)=>a-b)){if(year>Math.min(...analysisYears)){const prior=earningsRate(year-1,"currentChange");if(prior&&prior.rate<0){decisions.push({period:year+"年1Q",label:"要確認（前期末特例）",good:null});previousGood=null;}else{const d=classifyQuarter(year,"q1change",previousGood,year+"年1Q");if(d.label!=="未判定")decisions.push(d);previousGood=d.good;}}

document.getElementById("sidebarToggle").addEventListener("click",()=>{const shell=document.querySelector(".shell"),collapsed=shell.classList.toggle("sidebar-collapsed"),toggle=document.getElementById("sidebarToggle");document.getElementById("sidebar").classList.toggle("collapsed",collapsed);toggle.setAttribute("aria-label",collapsed?"メニューを展開":"メニューを折りたたむ");toggle.setAttribute("title",collapsed?"メニューを展開":"メニューを折りたたむ");toggle.setAttribute("aria-expanded",String(!collapsed));toggle.innerHTML=collapsed?'<svg aria-hidden="true" viewBox="0 0 20 20" width="18" height="18"><path d="m7.5 3.5 6.5 6.5-6.5 6.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>':'<svg aria-hidden="true" viewBox="0 0 20 20" width="18" height="18"><path d="m12.5 3.5-6.5 6.5 6.5 6.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'});
document.getElementById("mobileMenu").addEventListener("click",()=>{document.getElementById("sidebar").classList.add("mobile-open");document.getElementById("mobileBackdrop").classList.add("visible")});document.getElementById("mobileBackdrop").addEventListener("click",()=>{document.getElementById("sidebar").classList.remove("mobile-open");document.getElementById("mobileBackdrop").classList.remove("visible")});
document.getElementById("theme").addEventListener("click",()=>{const dark=document.documentElement.dataset.theme==="dark";document.documentElement.dataset.theme=dark?"":"dark";document.getElementById("theme").textContent=dark?"Dark":"Light"});
document.getElementById("userButton").onclick=()=>{if(currentRoleView==="admin")render("settings");};
setRoleView("user");
</script>
</body>
</html>
